name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RestHibernate
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: RestHibernate/pom.xml

      - name: Build and verify
        run: mvn -B verify

      - name: Upload WAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bidding-web-application
          path: RestHibernate/target/*.war
          if-no-files-found: ignore
